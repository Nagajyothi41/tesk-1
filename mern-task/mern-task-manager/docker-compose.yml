
version: "3"

services:
  mongo:
    image: mongo
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    command: npm run dev
    volumes:
      - ./backend:/app
    working_dir: /app
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    command: npm start
    volumes:
      - ./frontend:/app
    working_dir: /app
    ports:
      - "3000:3000"
    stdin_open: true
    depends_on:
      - backend
